version: '3.8'

x-resources: &resources_gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  # OpenALPR Core OCR Backend Service (In-Memory C++ Bindings)
  alpr:
    build:
      context: ./openalpr_backend
      dockerfile: Dockerfile
    image: wisrovi/open_alpr:1.3.0
    container_name: alpr_backend
    restart: always

  # LitServe + wyolo High-Throughput Inference API
  api:
    <<: *resources_gpu
    build:
      context: .
      dockerfile: Dockerfile
    image: wisrovi/open_alpr_api:1.3.0
    container_name: alpr_api
    restart: always
    ports:
      - "1037:1037"
    depends_on:
      - alpr
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "1037"
      OPENALPR_ENDPOINT: "http://alpr:8000/process_image/"
      YOLO_MODEL: "yolo11n.pt"
      IMGSZ: "640"
      CONF_THRESHOLD: "0.25"
      QUANTIZATION: "16"
      MAX_BATCH_SIZE: "8"
      BATCH_TIMEOUT: "0.0"
      MAX_CROP_DIM: "680"
      JPEG_QUALITY: "80"
      ACCELERATOR: "auto"
      ALPR_ENGINE: "gpu"
      GPU_DETECTOR_MODEL: "yolo-v9-t-384-license-plate-end2end"
      GPU_OCR_MODEL: "european-plates-mobile-vit-v2-model"
      GPU_DEVICE: "cuda"

  # Lightweight Gradio Web UI Frontend
  gradio-frontend:
    build:
      context: ./gradio
      dockerfile: Dockerfile
    image: wisrovi/open_alpr_frontend:1.3.0
    container_name: alpr_frontend
    restart: always
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      API_ENDPOINT: "http://api:1037/process_image/"
