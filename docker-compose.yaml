version: '3.8'

x-resources: &resources_gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  # OpenALPR Core OCR Backend Service
  alpr:
    image: wisrovi/open_alpr:1.0
    container_name: alpr_backend
    restart: always

  # LitServe + wyolo High-Throughput Inference API
  api:
    <<: *resources_gpu
    build:
      context: .
      dockerfile: Dockerfile
    image: wisrovi/open_alpr_api:1.1.0
    container_name: alpr_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - alpr
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      OPENALPR_ENDPOINT: "http://alpr:8000/process_image/"
      YOLO_MODEL: "yolo11n.pt"
      IMGSZ: "640"
      CONF_THRESHOLD: "0.25"
      QUANTIZATION: "16"
      MAX_BATCH_SIZE: "8"
      BATCH_TIMEOUT: "0.02"
      ACCELERATOR: "auto"

  # Lightweight Gradio Web UI Frontend
  gradio-frontend:
    build:
      context: ./gradio
      dockerfile: Dockerfile
    image: wisrovi/open_alpr_frontend:1.1.0
    container_name: alpr_frontend
    restart: always
    ports:
      - "7860:7860"
    depends_on:
      - api
    environment:
      API_ENDPOINT: "http://api:8000/predict"
